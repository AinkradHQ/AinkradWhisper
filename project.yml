name: AinkradWhisper
options:
  bundleIdPrefix: com.ainkrad
  deploymentTarget: { macOS: "14.0" }
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGNING_REQUIRED: NO
    CODE_SIGNING_ALLOWED: NO
    EAGER_LINKING: NO
packages:
  AinkradAppKit:
    url: https://github.com/AinkradHQ/AinkradAppKit
    # At or behind the host's pin, never ahead: the host embeds the one dynamic
    # copy of the SDK and a newer pin links symbols it does not define. See the
    # long comment in AinkradQuest/project.yml for why "behind" is not free either.
    # ccb6606: AinkradMenuButton placement (#51) and SignalDeepLink.symbol, for
    # the service icon on toasts. Needs a host at ccb6606 or later.
    revision: ccb6606cc48d90de966d89ef96c83d1a31cf5af0
targets:
  WhisperFeature:
    type: library.static
    platform: macOS
    sources: [Sources/WhisperFeature]
    dependencies:
      - package: AinkradAppKit
        embed: false
      - sdk: WebKit.framework
  WhisperPlugin:
    type: bundle
    platform: macOS
    sources: [Sources/WhisperPlugin]
    postBuildScripts:
      # Generate AinkradAPIVersion from the SDK this build linked,
      # rather than trusting the hand-typed Info.plist value.
      - script: '"$SRCROOT/scripts/stamp-api-version.sh"'
        name: Stamp AinkradAPIVersion
        # The plist is an INPUT so this runs after it is copied into the bundle.
        inputFiles:
          - $(TARGET_BUILD_DIR)/$(INFOPLIST_PATH)
        basedOnDependencyAnalysis: false
    dependencies:
      - target: WhisperFeature
      - package: AinkradAppKit
        embed: false
      - sdk: WebKit.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ainkrad.plugin.whisper
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Sources/WhisperPlugin/Info.plist
        MACH_O_TYPE: mh_bundle
        LD_RUNPATH_SEARCH_PATHS: "@executable_path/../Frameworks"
        OTHER_LDFLAGS: ["-lWhisperFeature"]
  WhisperFeatureTests:
    type: bundle.unit-test
    platform: macOS
    sources: [Tests/WhisperFeatureTests]
    dependencies:
      - target: WhisperFeature
      - package: AinkradAppKit
schemes:
  WhisperPlugin:
    build: { targets: { WhisperPlugin: all, WhisperFeatureTests: [test] } }
    test:  { config: Debug, targets: [WhisperFeatureTests] }
